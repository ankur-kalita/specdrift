# Development overrides. Layered on top of values.yaml by Argo CD's
# spec.source.helm.valueFiles. Later files win.
mode: diff
workload: daemonset

cronjob:
  # Fast feedback while experimenting.
  schedule: "*/2 * * * *"
  successfulJobsHistoryLimit: 5

includeVolatile: true

daemonset:
  intervalSeconds: 60

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 50m
    memory: 32Mi

