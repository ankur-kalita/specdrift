{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "specdrift.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "specdrift.labels" . | nindent 4 }}
# specdrift never talks to the Kubernetes API, so it does not need a token.
automountServiceAccountToken: false
{{- end }}
