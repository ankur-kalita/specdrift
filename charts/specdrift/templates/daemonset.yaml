{{- if eq .Values.workload "daemonset" }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "specdrift.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "specdrift.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "specdrift.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "specdrift.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "specdrift.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        seccompProfile:
          {{- toYaml .Values.securityContext.seccompProfile | nindent 10 }}
      containers:
        - name: specdrift
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          # A DaemonSet pod must not exit, so loop. `|| true` keeps the pod
          # alive when diff exits 1 — drift is a finding to log, not a
          # reason to crash-loop the pod.
          args:
            - |
              while true; do
                echo "--- $(date -u +%Y-%m-%dT%H:%M:%SZ) node=${SPECDRIFT_NODE} ---"
                {{ include "specdrift.command" . }} || true
                sleep {{ .Values.daemonset.intervalSeconds }}
              done
          securityContext:
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            capabilities:
              {{- toYaml .Values.securityContext.capabilities | nindent 14 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: SPECDRIFT_NODE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: work
              mountPath: /work
            {{- if eq .Values.mode "diff" }}
            - name: baseline
              mountPath: /baseline
              readOnly: true
            {{- end }}
      volumes:
        - name: work
          emptyDir: {}
        {{- if eq .Values.mode "diff" }}
        - name: baseline
          configMap:
            name: {{ include "specdrift.fullname" . }}-baseline
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
