[package]
name = "specdrift"
version = "0.1.0"
edition = "2021"
description = "Detects what changed about your machine since a saved baseline"
license = "MIT"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
time = { version = "0.3.55", features = ["formatting"] }
