name: CI

on:
  push:
  pull_request:

# If you push again while a run is still going, cancel the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check lints
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --all --verbose

  build:
    name: Build (${{ matrix.os }})
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Prove the binary actually runs
        run: cargo run --release -- snapshot -o snapshot.json

      - name: Save the binary
        uses: actions/upload-artifact@v4
        with:
          name: specdrift-${{ matrix.os }}
          path: |
            target/release/specdrift
            target/release/specdrift.exe
          if-no-files-found: error
